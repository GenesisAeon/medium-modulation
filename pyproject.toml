[project]
name = "medium-modulation"
version = "0.3.1"
description = "Resonant medium between SâˆA and SâˆV â€“ fractal modulation operators, resonance spectra and tunable interference for controlled information propagation."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "GenesisAeon Team", email = "team@genesisaeon.org"}]
dependencies = [
    "entropy-governance>=0.1.0",
    "entropy-table>=1.0.1",
    "implosive-genesis>=0.4.0",
    "sympy>=1.13.0",
    "typer>=0.15.0",
    "numpy>=2.0.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.9"]
docs = ["mkdocs>=1.6.0", "mkdocs-material>=9.5.0"]

[project.scripts]
mm = "medium_modulation.cli:app"

[project.urls]
Repository = "https://github.com/GenesisAeon/medium-modulation"
Issues = "https://github.com/GenesisAeon/medium-modulation/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medium_modulation"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "UP", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=medium_modulation --cov-report=term-missing -v"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

